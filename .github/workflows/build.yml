name: Build DarkFox OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - '.github/workflows/build.yml'
      - 'rootfs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev \
            libncurses-dev cpio xorriso wget xz-utils bzip2 \
            gcc make

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build DarkFox OS
        run: ./build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfox-os-iso
          path: darkfox-os.iso
          retention-days: 14

      - name: Show ISO info
        run: |
          ls -lh darkfox-os.iso
          file darkfox-os.iso || true
