name: Build DarkFox OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools squashfs-tools cpio

      - name: Make scripts executable
        run: |
          chmod +x auto/config
          find config/hooks -type f -name "*.hook.*" -exec chmod +x {} \; || true

      - name: Configure live-build
        run: |
          lb config

      - name: Build ISO
        run: |
          sudo lb build 2>&1 | tee build.log

      - name: Find and rename ISO
        run: |
          ISO=$(find . -maxdepth 1 -name "*.iso" -o -name "*.hybrid.iso" | head -1)
          if [ -z "$ISO" ]; then
            echo "No ISO found!"
            ls -la
            exit 1
          fi
          mv "$ISO" darkfox-os.iso
          ls -lh darkfox-os.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfox-os-iso
          path: darkfox-os.iso
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
