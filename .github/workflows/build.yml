name: Build DarkFox OS ISO

on:
  workflow_dispatch:   # manual only: Actions -> Build DarkFox OS ISO -> Run workflow

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Build ISO (Debian bookworm container)
        shell: bash
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work \
            debian:bookworm bash build.sh 2>&1 | tee build.log

      - name: Checksum
        run: sha256sum darkfox-os.iso > darkfox-os.iso.sha256

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfox-os-iso
          path: |
            darkfox-os.iso
            darkfox-os.iso.sha256

      - name: Prepare release files (GitHub allows max 2 GiB per file)
        run: |
          mkdir release
          size=$(stat -c%s darkfox-os.iso)
          echo "ISO size: $size bytes"
          if [ "$size" -ge 2000000000 ]; then
            split -b 1900M -d darkfox-os.iso release/darkfox-os.iso.part
          else
            mv darkfox-os.iso release/
          fi
          cp darkfox-os.iso.sha256 release/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DarkFox OS v${{ github.run_number }}
          body: |
            DarkFox OS - XFCE live system, bootable on BIOS and UEFI.

            **Login:** user `darkfox`, password `live` (autologin in live mode).
            **Secure Boot must be turned off** in the laptop BIOS.

            Write to USB with Rufus (DD mode), balenaEtcher, or:
            `sudo dd if=darkfox-os.iso of=/dev/sdX bs=4M status=progress oflag=sync`

            If the ISO was split into `darkfox-os.iso.part00`, `.part01`, join the parts first:
            Linux: `cat darkfox-os.iso.part* > darkfox-os.iso`
            Windows: `copy /b darkfox-os.iso.part00+darkfox-os.iso.part01 darkfox-os.iso`
          files: release/*
