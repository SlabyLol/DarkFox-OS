name: Build DarkFox OS ISO

on:
  workflow_dispatch:   # manual only: Actions -> Build DarkFox OS ISO -> Run workflow

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Build ISO (Debian bookworm container)
        shell: bash
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work \
            debian:bookworm bash build.sh 2>&1 | tee build.log

      - name: Checksum
        run: sha256sum darkfox-os.iso > darkfox-os.iso.sha256

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfox-os-iso
          path: |
            darkfox-os.iso
            darkfox-os.iso.sha256

      - name: Prepare release files (GitHub allows max 2 GiB per file)
        run: |
          mkdir release
          size=$(stat -c%s darkfox-os.iso)
          echo "ISO size: $size bytes"
          if [ "$size" -ge 2000000000 ]; then
            split -b 1900M -d darkfox-os.iso release/darkfox-os.iso.part
          else
            mv darkfox-os.iso release/
          fi
          cp darkfox-os.iso.sha256 release/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Prepare release notes
        run: |
          {
            echo "DarkFox OS v${{ github.run_number }} - XFCE live system, bootable on BIOS and UEFI."
            echo
            echo "# What's new"
            if [ -f CHANGELOG.md ]; then
              awk '/^## /{n++} n==1' CHANGELOG.md
              echo
              echo "Full history: file \`CHANGELOG.md\` in the release files."
            else
              echo "(No changelog available.)"
            fi
            echo
            echo "# Installation"
            echo
            echo "**Login:** user \`darkfox\`, password \`live\` (automatic login). After the first-time setup your own password is used."
            echo "**Secure Boot must be turned off** in the BIOS."
            echo
            echo "Write the ISO to a USB stick with Balena Etcher, Rufus (DD mode) or:"
            echo "\`sudo dd if=darkfox-os.iso of=/dev/sdX bs=4M status=progress oflag=sync\`"
            echo
            echo "If the ISO is split into parts (\`darkfox-os.iso.part00\`, \`.part01\` ...), join them first:"
            echo "Linux/Mac: \`cat darkfox-os.iso.part* > darkfox-os.iso\`"
            echo "Windows: \`copy /b darkfox-os.iso.part00+darkfox-os.iso.part01+darkfox-os.iso.part02 darkfox-os.iso\`"
          } > release-notes.md
          cat release-notes.md
          [ -f CHANGELOG.md ] && cp CHANGELOG.md release/ || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DarkFox OS v${{ github.run_number }}
          body_path: release-notes.md
          files: release/*
