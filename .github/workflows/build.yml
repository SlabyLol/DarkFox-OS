name: Build DarkFox OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Build DarkFox OS
        run: bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: darkfox-os-iso
          path: "*.iso"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
